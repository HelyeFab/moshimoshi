name: Sync Collaborator Branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync collaborator-access with main
        run: |
          git fetch origin collaborator-access:collaborator-access || git branch collaborator-access origin/main
          git checkout collaborator-access
          git merge main --ff-only || git reset --hard main
          git push origin collaborator-access --force-with-lease
