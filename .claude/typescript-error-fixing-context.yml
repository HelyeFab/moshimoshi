common_patterns_in_codebase:
  api_route_pattern:
    description: "Standard API route structure"
    example: |
      import { NextRequest, NextResponse } from 'next/server';
      import { withAuth } from '@/lib/auth';

      export const GET = withAuth(async (request: NextRequest, context: any) => {
        // Handler logic
        return NextResponse.json({ data });
      });

  firestore_query_pattern:
    description: "Firestore query with typing"
    example: |
      const snapshot = await adminDb!.collection('users').doc(uid).get();
      const userData = snapshot.data() as UserData | undefined;
      if (!userData) {
        return NextResponse.json({ error: 'Not found' }, { status: 404 });
      }

  hook_pattern:
    description: "Custom hook structure"
    example: |
      export function useMyHook(): MyHookReturn {
        const [data, setData] = useState<DataType | null>(null);
        // Hook logic
        return { data, ... };
      }

