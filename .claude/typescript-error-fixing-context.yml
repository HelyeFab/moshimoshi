commands:
  type_check:
    command: "npx tsc --noEmit"
    description: "Run TypeScript compiler without emitting files"
    timeout: "May take 2-3 minutes"

  count_errors:
    command: "npx tsc --noEmit 2>&1 | grep -E '^src/.*error TS' | grep -v '\\.test\\.' | grep -v '\\.spec\\.' | grep -v '__tests__' | wc -l"
    description: "Count non-test TypeScript errors"

  errors_by_file:
    command: "npx tsc --noEmit 2>&1 | grep -E '^src/.*error TS' | grep -v '\\.test\\.' | sed 's/(.*//'' | sort | uniq -c | sort -rn | head -30"
    description: "Top 30 files with most errors"

  build:
    command: "npm run build"
    description: "Run production build (will fail if ignoreBuildErrors: false)"

  dev:
    command: "npm run dev"
    description: "Run dev server (errors show as warnings, app still runs)"

