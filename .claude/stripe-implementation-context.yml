        - "37-42: Function config (region, maxInstances, secrets)"
        - "52-57: Signature header validation"
        - "68-88: Signature verification"
        - "91-104: Deduplication check"
        - "107-112: Event logging"
        - "118-167: Event routing switch"
        - "170: markProcessed(event.id)"
        - "180-194: Error handling (return 500 for retry)"
      event_routing:
        checkout: "checkout.session.completed -> applyCheckoutCompleted()"
        subscription: "customer.subscription.* -> applySubscriptionEvent()"
        invoice: "invoice.* -> applyInvoiceEvent()"

    - path: "functions/src/firestore.ts"
      purpose: "Data persistence layer"
      lines: 810
      key_sections:
        types:
          lines: "26-92"
          exports:
            - "SubscriptionPlan"
            - "SubscriptionStatus"
            - "UserSubscriptionFacts"
            - "UserDoc"
            - "StripeEventLog"
            - "ProcessedEvent"
            - "CustomerMapping"
            - "UidMapping"

        idempotency:
          lines: "100-146"
          functions:
            - "wasProcessed(eventId) - Check if already processed"
            - "markProcessed(eventId) - Mark as processed (30 day TTL)"
            - "batchMarkProcessed(eventIds[]) - Batch marking"

        logging:
          lines: "152-216"
          functions:
            - "logStripeEvent(event, extra?) - Log event for audit"
            - "logDedupedEvent(event) - Log deduped event"

        mapping:
          lines: "225-289"
          functions:
            - "mapUidToCustomer(uid, customerId) - Bidirectional mapping"
            - "getCustomerIdByUid(uid) - Get customer from uid"
            - "getUidByCustomerId(customerId) - Get uid from customer"
            - "hasCustomerMapping(customerId) - Check if mapping exists"

        subscription_facts:
          lines: "299-434"
          functions:
            - "upsertUserSubscriptionByCustomerId(customerId, facts)"
            - "upsertUserSubscriptionByUid(uid, customerId, facts)"
            - "clearUserSubscription(uid)"

        batch_operations:
          lines: "443-524"
          functions:
            - "batchUpdateSubscriptions(updates[])"
            - "buildSubscriptionData(customerId, facts)"

        transactions:
          lines: "533-597"
          functions:
            - "runTransaction(fn, maxAttempts) - With exponential backoff"
            - "atomicSubscriptionUpdate(uid, customerId, updater)"

        cleanup:
          lines: "606-674"
          functions:
            - "cleanupOldProcessedEvents(daysToKeep) - 30 day default"
            - "cleanupOldEventLogs(daysToKeep) - 90 day default"

        queries:
          lines: "683-765"
          functions:
            - "getUserSubscription(uid)"
            - "getRecentUserEvents(uid, limit)"
            - "getEventsByType(eventType, limit)"
            - "checkSubscriptionHealth(uid)"

  backend_handlers:
    - path: "functions/src/handlers/checkout.ts"
      purpose: "Checkout completion handler"
      key_lines:
        - "32-59: invalidateAllUserCaches()"
        - "72-143: applyCheckoutCompleted(event)"
        - "89-92: UID extraction fallback chain"
        - "108-132: Admin test checkout detection"
        - "151-190: handleSubscriptionCheckout()"
        - "236-258: extractPriceId() fallback chain"
      uid_sources:
        - "client_reference_id"
        - "metadata.uid"
        - "customer_details.metadata.uid"

    - path: "functions/src/handlers/subscriptions.ts"
      purpose: "Subscription lifecycle handler"
      key_lines:
        - "34-97: invalidateAllUserCaches() with retry logic"
        - "105-142: applySubscriptionEvent() router"
        - "150-170: handleSubscriptionCreated()"
        - "179-208: handleSubscriptionUpdated()"
        - "217-243: handleSubscriptionDeleted()"
        - "251-287: extractSubscriptionFacts()"
        - "295-317: normalizeSubscriptionStatus()"
      status_mapping:
        active: "active"
        past_due: "past_due"
        incomplete: "incomplete"
        incomplete_expired: "incomplete"
        trialing: "trialing"
        canceled: "canceled"
        unpaid: "canceled"
        paused: "past_due"

    - path: "functions/src/handlers/invoices.ts"
      purpose: "Invoice event handler"
      key_lines:
        - "23-66: applyInvoiceEvent() router"
        - "75-110: handleInvoicePaymentSucceeded()"
        - "119-173: handleInvoicePaymentFailed()"
        - "182-196: handleInvoiceCreated()"
        - "205-213: handleInvoiceFinalized()"
        - "222-247: handlePaymentActionRequired()"
      payment_failure_logic:
        with_retry: "status = 'past_due'"
        no_retry: "status = 'canceled'"

# ============================================================================
# FIRESTORE SCHEMA
# ============================================================================

firestore_schema:
  collections:
    users:
      path: "/users/{uid}"
      fields:
        subscription:
          plan: "SubscriptionPlan (free | premium_monthly | premium_yearly)"
          status: "SubscriptionStatus (active | incomplete | past_due | canceled | trialing)"
          stripeCustomerId: "string"
          stripeSubscriptionId: "string"
          stripePriceId: "string"
          currentPeriodEnd: "Timestamp"
          currentPeriodStart: "Timestamp"
          cancelAtPeriodEnd: "boolean"
          canceledAt: "Timestamp | null"
          trialEnd: "Timestamp | null"
          metadata:
            source: "'stripe'"
            updatedAt: "Timestamp"
            updateEventId: "string (event that caused update)"

    stripe_uid_to_customer:
      path: "/stripe/byUid/uidToCustomer/{uid}"
      fields:
        customerId: "string"
        createdAt: "Timestamp"
        updatedAt: "Timestamp"

    stripe_customer_to_uid:
      path: "/stripe/byCustomer/customerToUid/{customerId}"
      fields:
        uid: "string"
        createdAt: "Timestamp"
        updatedAt: "Timestamp"

    processed_events:
      path: "/ops/stripe/processed_events/{eventId}"
      fields:
        ts: "Timestamp"
        processedAt: "Timestamp"
        ttl: "Timestamp (30 days)"

    event_logs:
      path: "/logs/stripe/events/{auto-id}"
      fields:
        ts: "Timestamp"
        eventId: "string"
        type: "string"
        requestId: "string | null"
        livemode: "boolean"
        uid: "string | null"
        customerId: "string | null"
        objectId: "string | null"
        payloadSummary:
          status: "string"
          priceId: "string"
          amount: "number"
          currency: "string"
        processing:
          deduped: "boolean"
          applied: "boolean"
          error: "string | null"
          processingTimeMs: "number"

    admin_logs:
      path: "/admin_logs/{auto-id}"
      fields:
        action: "string"
        adminUid: "string"
        adminEmail: "string"
        targetUserId: "string"
        fromPlan: "string"
        toPlan: "string"
        reason: "string"
        timestamp: "Timestamp"

# ============================================================================
# WEBHOOK EVENTS HANDLED
# ============================================================================

webhook_events:
  checkout:
    - event: "checkout.session.completed"
      handler: "applyCheckoutCompleted"
      actions:
        - "Create UID-Customer mapping"
        - "Update subscription facts"
        - "Invalidate caches"

  subscription:
    - event: "customer.subscription.created"
      handler: "handleSubscriptionCreated"
      actions:
        - "Extract subscription facts"
        - "Upsert to Firestore"
        - "Invalidate caches"

    - event: "customer.subscription.updated"
      handler: "handleSubscriptionUpdated"
      actions:
        - "Extract updated facts"
        - "Upsert to Firestore"
        - "Invalidate caches"

    - event: "customer.subscription.deleted"
      handler: "handleSubscriptionDeleted"
      actions:
        - "Set plan to 'free'"
        - "Set status to 'canceled'"
        - "Clear subscription IDs"
        - "Invalidate caches (critical for security)"

    - event: "customer.subscription.paused"
      handler: "applySubscriptionEvent"
      status: "Logged but not actively processed"

    - event: "customer.subscription.resumed"
      handler: "applySubscriptionEvent"
      status: "Logged but not actively processed"

  invoice:
    - event: "invoice.payment_succeeded"
      handler: "handleInvoicePaymentSucceeded"
      actions:
        - "Set status to 'active'"
        - "Update payment metadata"

    - event: "invoice.payment_failed"
      handler: "handleInvoicePaymentFailed"
      actions:
        - "Set status to 'past_due' or 'canceled'"
        - "Track failure metadata"

    - event: "invoice.payment_action_required"
      handler: "handlePaymentActionRequired"
      actions:
        - "Set status to 'incomplete'"
        - "Store hosted_invoice_url"

    - event: "invoice.created"
      handler: "handleInvoiceCreated"
      status: "Logged only"

    - event: "invoice.finalized"
      handler: "handleInvoiceFinalized"
      status: "Logged only"

  customer:
    events:
      - "customer.created"
      - "customer.updated"
      - "customer.deleted"
    status: "Received but not processed (logged)"

  payment_method:
    events:
      - "payment_method.attached"
      - "payment_method.detached"
      - "payment_method.updated"
    status: "Received but not processed (logged)"

# ============================================================================
# SECURITY IMPLEMENTATION
# ============================================================================

security:
  webhook_signature:
    description: "Stripe webhook signature verification"
    frontend:
      file: "src/app/api/stripe/webhook/route.ts"
      method: "stripe.webhooks.constructEvent(rawBody, sig, secret)"
      critical: "Must use req.text() to preserve raw body"
    backend:
      file: "functions/src/webhook.ts"
      method: "stripe.webhooks.constructEvent(rawBody, sig, webhookSecret)"
      note: "Functions v2 provides rawBody automatically"

  admin_authorization:
    description: "Admin-only endpoint protection"
    pattern: |
      async function isUserAdmin(uid: string): Promise<boolean> {
        const userDoc = await adminFirestore.collection('users').doc(uid).get()
        return userDoc.data()?.isAdmin === true
      }
    used_in:
      - "admin/stripe/test-checkout"
      - "admin/stripe/test-renewal"
      - "admin/stripe/test-cancel"
      - "admin/stripe/cleanup"
      - "admin/subscriptions/upgrade"

  api_key_management:
    environment_variables:
      frontend:
        - "STRIPE_SECRET_KEY"
        - "STRIPE_WEBHOOK_SECRET"
        - "NEXT_PUBLIC_STRIPE_PRICE_MONTHLY"
        - "NEXT_PUBLIC_STRIPE_PRICE_YEARLY"
      backend:
        - "STRIPE_SECRET_KEY (Google Secret Manager)"
        - "STRIPE_WEBHOOK_SECRET (Google Secret Manager)"
        - "APP_URL"
    best_practices:
      - "Secrets in Google Secret Manager (not env vars)"
      - "Public keys prefixed with NEXT_PUBLIC_ only"
      - "Validation on startup (throws if missing)"

  session_auth:
    description: "Session-based authentication for API routes"
    pattern: |
      const session = await getSession()
      if (!session?.uid) return 401
    file: "src/lib/auth/session.ts"
    note: "Uses Redis-backed JWT sessions, not Firebase tokens"

# ============================================================================
# CACHE INVALIDATION
# ============================================================================

cache_invalidation:
  endpoint: "/api/auth/invalidate-all-caches"
  trigger_events:
    - "checkout.session.completed"
    - "customer.subscription.created"
    - "customer.subscription.updated"
    - "customer.subscription.deleted"

  cache_types:
    - name: "Tier cache"
      ttl: "30s"
      purpose: "User subscription level"
    - name: "Session cache"
      ttl: "1hr"
      purpose: "User session data"
    - name: "Stats cache"
      ttl: "1hr"
      purpose: "Progress, streaks"
    - name: "Queue cache"
      ttl: "30min"
      purpose: "Review queue"
    - name: "Entitlements cache"
      ttl: "10min"
      purpose: "Feature flags"
    - name: "Profile cache"
      ttl: "15min"
      purpose: "User profile data"

  retry_logic:
    max_retries: 3
    backoff: "Exponential (1s, 2s, 3s)"
    on_failure: "Log error, don't fail webhook"

  rationale: |
    We invalidate everything on subscription changes because:
    1. Zero staleness - user sees premium immediately
    2. Simple logic - no selective invalidation bugs
    3. Rare operation - minimal performance impact

# ============================================================================
# KNOWN ISSUES & FIXES
# ============================================================================

bugs_fixed:
  - id: "BUG-001"
    name: "Duplicate Event Processing"
    status: "FIXED"
    root_cause: "Webhooks processed multiple times due to Stripe retries"
    solution: "Idempotency via Firestore processed_events collection"
    files:
      - "functions/src/firestore.ts:100-123"
      - "functions/src/webhook.ts:92-100"

  - id: "BUG-002"
    name: "Session Staleness"
    status: "FIXED"
    root_cause: "Users saw old tier due to Redis cache (1hr TTL)"
    solution: "Comprehensive cache invalidation on subscription changes"
    files:
      - "functions/src/handlers/subscriptions.ts:34-97"
      - "functions/src/handlers/checkout.ts:32-59"

  - id: "BUG-003"
    name: "Admin Upgrade Plan Mismatch"
    status: "FIXED"
    root_cause: "Admin upgrades used requested plan instead of actual Stripe price ID"
    solution: "Use toPlan(actualPriceId) from subscription.items.data[0].price.id"
    file: "src/app/api/admin/subscriptions/upgrade/route.ts:220-226"
    code_change: |
      // OLD (WRONG):
      subscription.plan = plan  // User's request

      // NEW (CORRECT):
      const actualPriceId = subscription.items.data[0]?.price.id
      const actualPlan = toPlan(actualPriceId) || plan
      subscription.plan = actualPlan  // What Stripe actually created

  - id: "BUG-004"
    name: "Missing Customer Validation"
    status: "FIXED"
    root_cause: "Checkout failed if customer deleted in Stripe but still mapped in Firestore"
    solution: "Customer existence verification before use"
    file: "src/app/api/stripe/create-checkout-session/route.ts:54-62"
    code_pattern: |
      if (customerId) {
        try {
          await stripe.customers.retrieve(customerId)
        } catch (error) {
          customerId = null  // Customer doesn't exist, create new
        }
      }

  - id: "BUG-005"
    name: "API Version Mismatch"
    status: "FIXED"
    root_cause: "Frontend and backend used different Stripe API versions"
    solution: "Standardized to 2025-08-27.basil everywhere"
    files:
      - "src/lib/stripe/server.ts:32"
      - "functions/src/stripeClient.ts:32"

