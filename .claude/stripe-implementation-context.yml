# PERFORMANCE CHARACTERISTICS
# ============================================================================

performance:
  webhook_processing:
    target: "<500ms per event"
    actual: "~200-300ms average"
    breakdown:
      signature_verification: "~10ms"
      deduplication_check: "~20ms"
      event_routing: "~5ms"
      handler_processing: "~100-200ms"
      cache_invalidation: "~50-100ms (with retries)"
      logging: "~10-20ms"
      mark_processed: "~20ms"

  bottlenecks:
    - "Cache invalidation (up to 300ms on retries)"
    - "Firestore writes (region latency)"
    - "Stripe API calls (customer retrieval)"

  optimizations:
    - "Lazy customer creation"
    - "Batch writes where possible"
    - "Async cache invalidation"

  concurrency:
    max_instances: 100
    region: "europe-west1"
    expected_load:
      normal: "1-5 webhooks/min"
      peak: "50-100 webhooks/min"
      burst: "500+ webhooks/min"

# ============================================================================
# BEST PRACTICES IMPLEMENTED
# ============================================================================

best_practices:
  idempotency:
    - "All webhook handlers are idempotent"
    - "Event deduplication via Firestore"
    - "Retries are safe (Stripe retries failed webhooks)"

  error_handling:
    - "Returns 500 on failure -> Stripe retries"
    - "Returns 200 on success or duplicate -> Stripe stops"
    - "Comprehensive logging for debugging"

  security:
    - "Webhook signature verification"
    - "Admin authorization checks"
    - "Secrets in Secret Manager"
    - "Session-based auth (not client tokens)"

  data_consistency:
    - "Bidirectional UID <-> Customer mapping"
    - "Subscription facts as single source of truth"
    - "Atomic writes with transactions"
    - "Cache invalidation on all changes"

  observability:
    - "Comprehensive event logging"
    - "Audit trails for admin actions"
    - "Health check endpoints"
    - "Detailed error messages"

# ============================================================================
# IMPORTANT NOTES
# ============================================================================

important_notes:
  user_preferences:
    - "User prefers facts over hypotheses - investigate first"
    - "Always commit changes before testing"
    - "Use TodoWrite for multi-step tasks"
    - "Ask before making configuration changes"
    - "User is direct - don't over-apologize, just fix issues"

  architectural_decisions:
    - "Server-side auth only with Firebase Admin SDK"
    - "JWT sessions in Redis with 24hr expiry"
    - "Bidirectional mapping for O(1) lookups"
    - "Subscription facts (not full Stripe objects)"
    - "Last-write-wins for event ordering"

  do_not_modify:
    - "Payment/subscription flows without explicit request"
    - "Webhook signature verification logic"
    - "Idempotency implementation"
    - "Price ID mappings without Stripe dashboard update"
    - "Cache invalidation scope (invalidate all, not selective)"

  common_pitfalls:
    - issue: "Forgetting to invalidate caches after subscription change"
      why: "User sees stale tier for up to 1 hour"

    - issue: "Using Firebase token instead of session auth"
      why: "Server uses Redis sessions, not Firebase tokens"

    - issue: "Not verifying customer exists in Stripe"
      why: "Customer may be deleted but still mapped in Firestore"

    - issue: "Using requested plan instead of actual price ID"
      why: "Stripe subscription may have different price than requested"

    - issue: "Not marking event as processed on error"
      why: "Actually correct - allows Stripe to retry"

