version: "1.0"

metadata:
  name: "Stripe Integration Implementation Context"
  id: "moshimoshi-stripe-integration-v1.0"
  role: "Guide future AI agents working on Stripe payment, subscription, and billing features"
  created: "2025-12-01"
  updated: "2025-12-01"
  owner: "beano"
  project: "Moshimoshi Japanese Learning Platform"
  tags:
    - "stripe"
    - "payments"
    - "subscriptions"
    - "webhooks"
    - "firebase-functions"
    - "billing"
    - "checkout"
    - "invoices"

# ============================================================================
# EXECUTIVE SUMMARY
# ============================================================================

executive_summary:
  description: |
    Production-grade, enterprise-level Stripe integration supporting subscription management,
    checkout flows, billing portal, invoice management, admin testing infrastructure, and
    one-time donations. The system spans 32 critical files across frontend (Next.js 15 App Router)
    and backend (Firebase Cloud Functions v2).

  architecture_highlights:
    - "Dual-layer webhook processing: Next.js API webhook + Firebase Functions webhook"
    - "Bidirectional customer-UID mapping in Firestore"
    - "Idempotent event processing with deduplication"
    - "Multi-tier caching invalidation system (6 cache types)"
    - "Admin testing suite for zero-cost production testing"
    - "Comprehensive audit logging for all Stripe events"

  production_status: "READY"
  total_files_analyzed: 32
  total_lines_of_code: "~7,500"

# ============================================================================
# PROJECT TECH STACK
# ============================================================================

tech_stack:
  framework: "Next.js 15.5.2"
  language: "TypeScript"
  backend: "Firebase Cloud Functions v2"
  database: "Firestore"
  payments: "Stripe"
  region: "europe-west1"
  stripe_api_version: "2025-08-27.basil"
  auth: "Firebase Auth + Custom JWT Sessions (Redis)"
  caching: "Redis (Vercel KV)"

# ============================================================================
# PRICING CONFIGURATION
# ============================================================================

pricing:
  currency: "GBP"
  currency_symbol: "£"

  plans:
    free:
      price: 0
      features:
        - "Basic drills"
        - "Limited reviews"
        - "Offline access (IndexedDB only)"

    premium_monthly:
      price: 8.99
      interval: "month"
      price_ids:
        test: "price_1S6wG7HdrJomitOw5YvQ71DD"
        production: "price_1S6vKuHdrJomitOw4XuExllV"
      features:
        - "All drills and content"
        - "Unlimited reviews"
        - "Firebase sync"
        - "Advanced analytics"

    premium_yearly:
      price: 99.99
      interval: "year"
      savings_percentage: 7
      price_ids:
        test: "price_1S6wGGHdrJomitOwcmT2JeUG"
        production: "price_1S6vMBHdrJomitOwweaSGhYp"
      features:
        - "All premium features"
        - "Best value"

  easter_egg:
    description: "Admin-only zero-cost subscription for production testing"
    price_id: "price_1SEXlIHdrJomitOw956pZB3q"
    amount: 0
    interval: "month"

# ============================================================================
# ARCHITECTURE OVERVIEW
# ============================================================================

architecture:
  layers:
    frontend:
      description: "Next.js 15 App Router with React Server Components"
      components:
        library:
          path: "src/lib/stripe/"
          files:
            - "server.ts - Stripe client initialization (singleton)"
            - "types.ts - TypeScript definitions"
            - "mapping.ts - Price ID to plan conversion"
            - "api.ts - Client-side API wrapper"
            - "invoice-messages.ts - UI message generator"

        api_routes:
          path: "src/app/api/"
          count: 11
          categories:
            user_routes:
              - "stripe/webhook/route.ts"
              - "stripe/create-checkout-session/route.ts"
              - "stripe/create-portal-session/route.ts"
              - "stripe/invoices/route.ts"
              - "stripe/donate/route.ts"
            admin_routes:
              - "admin/stripe/test-checkout/route.ts"
              - "admin/stripe/test-renewal/route.ts"
              - "admin/stripe/test-cancel/route.ts"
              - "admin/stripe/cleanup/route.ts"
              - "admin/stripe/health/route.ts"
              - "admin/subscriptions/upgrade/route.ts"

        config:
          path: "src/config/"
          files:
            - "pricing.ts - Pricing configuration (single source of truth)"
            - "donations.ts - Donation configuration"

    backend:
      description: "Firebase Cloud Functions v2 (Node.js 20)"
      components:
        infrastructure:
          path: "functions/src/"
          files:
            - "stripeClient.ts - Singleton Stripe client"
            - "mapping/stripeMapping.ts - Price ID mapping"
            - "webhook.ts - Main webhook handler"
            - "firestore.ts - Data persistence layer (810 lines)"

        handlers:
          path: "functions/src/handlers/"
          files:
            - "checkout.ts - checkout.session.completed handler"
            - "subscriptions.ts - customer.subscription.* handlers"
            - "invoices.ts - invoice.* handlers"

  data_flow:
    checkout:
      description: "User subscription flow"
      steps:
        - "User clicks Subscribe on Pricing page"
        - "POST /api/stripe/create-checkout-session"
        - "Session auth via getSession()"
        - "Get/create Stripe customer"
        - "Create bidirectional mapping (uid <-> customerId)"
        - "Create Stripe Checkout session"
        - "Redirect to Stripe Checkout"
        - "User completes payment"
        - "Stripe sends webhooks to Firebase Functions"
        - "Webhook handler processes events"
        - "Firestore updated with subscription facts"
        - "Cache invalidation triggers"
        - "User sees premium features immediately"

    webhook:
      description: "Webhook processing flow"
      steps:
        - "Stripe sends POST to webhook endpoint"
        - "Verify signature with STRIPE_WEBHOOK_SECRET"
        - "Check deduplication: wasProcessed(event.id)"
        - "Log event to Firestore"
        - "Route to appropriate handler"
        - "Handler updates Firestore"
        - "Invalidate user caches"
        - "Mark event as processed"
        - "Return 200 (or 500 to retry)"

# ============================================================================
# CRITICAL FILES WITH LINE REFERENCES
# ============================================================================

critical_files:
  frontend_library:
    - path: "src/lib/stripe/server.ts"
      purpose: "Server-side Stripe client initialization"
      key_lines:
        - "32: apiVersion '2025-08-27.basil'"
        - "35: maxNetworkRetries: 2"
        - "36: timeout: 20000"
      exports:
        - "getStripe() - Returns singleton Stripe instance"

    - path: "src/lib/stripe/types.ts"
      purpose: "TypeScript definitions for Stripe integration"
      key_types:
        - "SubscriptionPlan = 'free' | 'premium_monthly' | 'premium_yearly'"
        - "SubscriptionStatus = 'active' | 'incomplete' | 'past_due' | 'canceled' | 'trialing'"
        - "CheckoutSessionRequest"
        - "PortalSessionRequest"
        - "Invoice interface"

    - path: "src/lib/stripe/mapping.ts"
      purpose: "Price ID to plan mapping (frontend)"
      key_functions:
        - "toPlan(priceId) - Convert price ID to plan name"
        - "getPriceId(plan) - Get price ID for plan"
        - "isValidPriceId(priceId) - Validate price ID"
      key_constants:
        - "PRICE_TO_PLAN - Mapping object"

    - path: "src/lib/stripe/api.ts"
      purpose: "Client-side API wrapper"
      key_functions:
        - "createCheckoutSession(priceId, successUrl, cancelUrl)"
        - "createPortalSession(returnUrl)"
        - "fetchInvoices()"
      idempotency: "Uses crypto.randomUUID() for idempotency keys"

    - path: "src/lib/stripe/invoice-messages.ts"
      purpose: "User-friendly invoice messages"
      key_functions:
        - "getInvoiceMessage(status, amount, currency)"
        - "formatCurrency(amount, currency)"

  frontend_api_routes:
    - path: "src/app/api/stripe/create-checkout-session/route.ts"
      purpose: "Creates Stripe Checkout sessions"
      key_lines:
        - "19: getSession() for authentication"
        - "52-70: Customer creation/retrieval with Stripe verification"
        - "74-102: Checkout session creation with metadata"
      security:
        - "Session-based auth (not Firebase token)"
        - "Customer existence verification"
        - "Idempotency key support"

    - path: "src/app/api/stripe/create-portal-session/route.ts"
      purpose: "Creates Stripe Billing Portal sessions"
      key_lines:
        - "39: getCustomerIdByUid(uid)"
        - "51-54: Portal session creation"
      requires: "Existing Stripe customer"

    - path: "src/app/api/stripe/invoices/route.ts"
      purpose: "Fetches user invoices"
      key_lines:
        - "25-29: Fetch last 100 invoices"
        - "32-37: Filter out $0 test invoices"
      returns: "Simplified invoice format for UI"

    - path: "src/app/api/stripe/donate/route.ts"
      purpose: "One-time donation checkout"
      key_lines:
        - "17-22: Minimum $1.00 validation"
        - "43-70: Payment mode checkout"
      supports: "Anonymous donations (no auth required)"

    - path: "src/app/api/admin/stripe/test-checkout/route.ts"
      purpose: "Admin-only zero-cost production testing"
      key_lines:
        - "22: EASTER_EGG_PRICE_ID"
        - "25-53: isUserAdmin() check"
        - "121-130: Production-only enforcement"
        - "233-259: Checkout session with test metadata"
        - "273-280: Audit logging"
      security:
        - "Admin-only (Firestore isAdmin check)"
        - "Production-only"
        - "Easter egg price validation"

    - path: "src/app/api/admin/stripe/test-renewal/route.ts"
      purpose: "Simulates subscription renewal"
      key_lines:
        - "86-96: Create invoice item"
        - "102-112: Create invoice"
        - "123: Finalize invoice"
        - "128: Pay invoice (triggers webhook)"
      triggers: "invoice.payment_succeeded webhook"

    - path: "src/app/api/admin/stripe/test-cancel/route.ts"
      purpose: "Tests subscription cancellation"
      key_lines:
        - "86-88: Cancel subscription immediately"
      triggers: "customer.subscription.deleted webhook"

    - path: "src/app/api/admin/stripe/cleanup/route.ts"
      purpose: "Comprehensive admin cleanup"
      key_lines:
        - "75-86: Cancel all subscriptions"
        - "89-109: Void open invoices"
        - "112: Reset Firestore to free tier"
        - "116-134: Invalidate all caches"
        - "162-188: resetFirestoreSubscription()"
      actions:
        - "Cancel all active subscriptions"
        - "Void open invoices"
        - "Reset Firestore subscription to free"
        - "Invalidate all user caches"

    - path: "src/app/api/admin/stripe/health/route.ts"
      purpose: "Health check endpoint"
      checks:
        - "Session status"
        - "Firebase Admin availability"
        - "Admin status"
        - "Stripe configuration"
        - "App URL configuration"
      returns: "HEALTHY or UNHEALTHY with details"

    - path: "src/app/api/admin/subscriptions/upgrade/route.ts"
      purpose: "Admin-initiated subscription changes"
      key_lines:
        - "162-185: Create 100% off coupon"
        - "192-216: Create subscription with coupon"
        - "220-226: CRITICAL FIX - Use actual price ID from subscription"
        - "251-261: Audit logging"
      critical_fix:
        issue: "Was using requested plan instead of actual Stripe price"
        solution: "Use toPlan(actualPriceId) from subscription items"

  backend_infrastructure:
    - path: "functions/src/stripeClient.ts"
      purpose: "Singleton Stripe client for Firebase Functions"
      key_lines:
        - "30-42: Stripe initialization with config"
        - "31: apiVersion '2025-08-27.basil'"
        - "34-36: maxNetworkRetries, timeout, telemetry"
        - "63-72: verifyStripeConnection()"
        - "80-99: getStripeDashboardUrl(objectId)"
      exports:
        - "getStripe() - Returns Stripe instance"
        - "verifyStripeConnection() - Health check"
        - "getStripeDashboardUrl(objectId) - Dashboard links"

    - path: "functions/src/mapping/stripeMapping.ts"
      purpose: "Price ID mapping for backend"
      key_lines:
        - "20-24: Hardcoded price IDs (TEST and PROD)"
        - "29-40: TEST_PRICES and PRODUCTION_PRICES maps"
        - "53-56: PRICE_TO_PLAN combined mapping"
        - "71-74: toPlan(priceId)"
        - "89-102: getSubscriptionPlan(priceId, hasActive)"
      exports:
        - "toPlan(priceId)"
        - "getSubscriptionPlan(priceId, hasActive)"
        - "isValidPriceId(priceId)"
        - "getPriceIdsForPlan(plan)"
        - "isTestPrice(priceId)"
        - "isLegacyPrice(priceId)"
        - "DEFAULT_PLAN, DEFAULT_PAID_PLAN"

    - path: "functions/src/webhook.ts"
      purpose: "Main Stripe webhook handler"
      key_lines:
