      status: "⏳ PENDING"
      duration: "Week 2 (parallel with Phase 1)"
      priority: "HIGH"
      estimated_completion: "2025-01-22"

      objectives:
        - "Fix 2 TypeScript errors in UniversalProgressManager.ts"
        - "Remove ignoreBuildErrors from next.config.ts"
        - "Enable strict type checking"

      files_to_modify:
        - path: "src/lib/review-engine/progress/UniversalProgressManager.ts"
          lines: [211, 214]
          issue: "Unused _debugInfo variable causing syntax error"

        - path: "next.config.ts"
          lines: [20, 23]
          issue: "ignoreBuildErrors: true bypasses type safety"

      success_criteria:
        - "✅ 0 TypeScript errors (npx tsc --noEmit)"
        - "✅ Strict checking enabled"
        - "✅ Build fails on future errors"

    phase_3a:
      name: "Bundle Optimization"
      status: "⏳ PENDING"
      duration: "Week 3-6 (4 weeks, parallel with 3B)"
      priority: "HIGH"
      estimated_completion: "2025-02-19"

      objectives:
        week_3:
          - "Replace react-icons with lucide-react (-40MB)"
          - "Dynamic import framer-motion (-40MB)"
          - "Remove axios, use fetch (-12MB)"
          - "Setup bundle analyzer"
        week_4:
          - "Lazy load Tiptap (admin only)"
          - "Lazy load Recharts (dashboard)"
          - "Lazy load Kuromoji (furigana)"
          - "Dynamic import games"
        week_5:
          - "Firebase tree-shaking"
          - "Image optimization (WebP/AVIF)"
