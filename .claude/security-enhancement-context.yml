common_pitfalls:
  must_know:
    - issue: "Always test on staging first"
      why: "Security changes can break authentication"

    - issue: "JWT rotation logs out all users"
      mitigation: "Announce maintenance window 24hrs advance"

    - issue: "Rate limiting needs Redis configured"
      check: "UPSTASH_REDIS_REST_URL and TOKEN in env"

    - issue: "Dynamic imports need loading states"
      why: "Prevents blank screens during code loading"

    - issue: "PWA migration may prompt reinstall"
      mitigation: "Gradual rollout (10% → 50% → 100%)"

    - issue: "Bundle analyzer requires production build"
      command: "ANALYZE=true npm run build"

    - issue: "Suspense requires async Server Components"
      pattern: "export default async function Page() { const data = await fetch(...) }"

  debugging_tips:
    - "Check Sentry for authentication errors after JWT rotation"
    - "Monitor Redis for rate limit performance"
    - "Use Network tab to verify rate limit headers"
    - "Check bundle analyzer for unexpected large dependencies"
    - "Profile with React DevTools after Suspense implementation"
    - "Test PWA offline mode in browser DevTools (Application → Service Workers)"

integration_points:
  firebase_admin:
    file: "src/lib/firebase/admin.ts"
    usage: "Server-side only (API routes)"
    functions:
      - "adminAuth.verifyIdToken(token)"
      - "adminFirestore.collection('user_stats')"

  upstash_redis:
    client: "@upstash/redis"
    ratelimit: "@upstash/ratelimit"
    env_vars:
      - "UPSTASH_REDIS_REST_URL"
      - "UPSTASH_REDIS_REST_TOKEN"

  sentry:
    package: "@sentry/nextjs"
    version: "10.11.0"
    config: "sentry.client.config.ts, sentry.server.config.ts"
    features:
      - "Error tracking"
      - "Performance monitoring"
      - "User feedback"

