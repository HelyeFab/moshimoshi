    usage: |
      # Show current streak status
      streak
      > Choose option 1

      # Run common test scenario
      streak
      > Choose option 6 (s6: 7-day streak, 2 days ago, 200 XP)

      # Create snapshot before testing
      streak
      > Choose option 2

      # Restore snapshot after testing
      streak
      > Choose option 3

  manual_test_flow:
    setup:
      - "Restart dev server: pkill -f 'npm run dev' && npm run dev"
      - "Run s6 scenario: streak > option 6"
      - "Clear localStorage: localStorage.removeItem('moshimoshi_streak_save_prompt_date')"

    test_auto_break:
      - "Open dashboard: http://localhost:3000/dashboard"
      - "Watch console for: [useStreakSaveDetection] Streak auto-broken"
      - "Watch console for: [useStreakSaveDetection] ✓ Gamification data reloaded"
      - "Verify dashboard shows streak=0 immediately (not 7)"
      - "Modal should appear"
      - "Close/decline modal"

    test_daily_xp:
      - "Navigate to /drill"
      - "Complete drill 1 (1-2 correct): Earn ~5-10 XP"
      - "Watch console: [Gamification Coordinator] Daily XP Accumulation: newDailyXP: 5-10"
      - "Complete drill 2 (1-2 correct): Earn ~5-10 XP"
      - "Watch console: newDailyXP: 15-20"
      - "Complete drill 3 (1-2 correct): Earn ~5-10 XP"
      - "Watch console: newDailyXP: 25+ (should trigger streak update)"

    verify_results:
      - "Run: streak > option 1"
      - "Verify: Streak = 1 (not 0)"
      - "Verify: XP = 225+ (200 + daily XP)"
      - "Verify: Last Activity = today (2025-11-06)"
      - "Verify: Status = ✓ Active"

  automated_tests:
    unit_tests:
      - "src/app/api/gamification/streak/save/__tests__/unit.test.ts (45 tests)"
      - "Cost calculation, eligibility validation, integration scenarios"

    hook_tests:
      - "src/hooks/__tests__/useStreakSaveDetection.test.tsx (40 tests)"
      - "Trigger conditions, feature gates, error handling, user scenarios"

    run_command: |
      npm test -- src/app/api/gamification/streak/save/__tests__/unit.test.ts src/hooks/__tests__/useStreakSaveDetection.test.tsx

common_pitfalls:
  must_know:
    - issue: "Always use streak alias, not direct node command"
      why: "Alias properly sets up environment and paths"

    - issue: "Clear localStorage before testing auto-break"
      why: "Prevents 'already prompted today' check from blocking modal"
      code: "localStorage.removeItem('moshimoshi_streak_save_prompt_date')"

    - issue: "Dashboard shows stale data after DB update"
      solution: "Ensure loadFromFirebase() is called after mutations"

    - issue: "Streak threshold is 25 XP, not 10"
      note: "User explicitly rejected lowering threshold"
      reason: "Multiple small drills should accumulate, not lower bar"

    - issue: "Cost uses daysSinceActivity, not daysSinceBreak"
      why: "daysSinceBreak is always 0 on same day as break"

    - issue: "Console logs needed for debugging daily XP"
      location: "gamification-coordinator.ts lines 130-170, 240-280"
      keep: "Don't remove these logs until feature is stable"

  debugging_tips:
    - "Check browser console for [Gamification Coordinator] logs"
    - "Verify Firebase data with: streak > option 1"
    - "Test in incognito to avoid localStorage cache"
    - "Hard refresh (Ctrl+Shift+R) if data seems stale"
    - "Check Network tab for /api/gamification/* calls"

integration_points:
  zustand_store:
    file: "src/state/userGamification.ts"
    key_functions:
      - "loadFromFirebase(): Loads from /api/gamification/load"
      - "saveToIndexedDB(): Caches locally for offline"
      - "loadFromIndexedDB(): Fallback for offline mode"

  firebase_admin:
    file: "src/lib/firebase/admin.ts"
    usage: "Server-side only (API routes, Cloud Functions)"
    note: "Never use in client components"

  react_hooks:
    useGamification: "Main hook for accessing streak/XP state"
    useStreakSaveDetection: "Auto-break detection and modal trigger"
    useAutoSync: "Background sync (dashboard)"

