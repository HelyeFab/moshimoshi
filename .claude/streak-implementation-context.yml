feature:
  name: "Streak XP-Save System with Daily XP Accumulation"
  status: "Phase 2.5 - In Progress"
  total_estimated_time: "3-4 days across phases"
  current_phase: "Daily XP Accumulation Fix"

  phases:
    phase_1:
      name: "Emergency UI Fix"
      status: "✅ COMPLETE"
      completion_date: "2025-11-06"
      test_results: "40/40 tests passing (100%)"
      files_modified: 3
      files_created: 2
      outcome: "UI shows accurate streak status, broken streaks display correctly"

    phase_2:
      name: "XP-Save Mechanic"
      status: "✅ COMPLETE"
      completion_date: "2025-11-06"
      code_written: "2000+ lines across 6 files"
      test_results: "85/85 tests passing (100%)"
      components:
        - "API endpoint: /api/gamification/streak/save"
        - "Modal component: StreakSaveModal.tsx"
        - "Detection hook: useStreakSaveDetection.ts"
        - "Dashboard integration"
      configuration:
        enabled: true
        surge_pricing: true
        save_window_days: 3
        base_cost: 25

    phase_2_5:
      name: "Database Sync & Auto-Break + Daily XP Accumulation"
      status: "🔄 IN PROGRESS"
      current_work: "Daily XP accumulation for streak validation"
      estimated_time: "2-3 hours"

      problems_identified:
        - name: "Per-Drill XP Checking"
          description: "Streak checked XP per-drill (5 XP < 25) instead of daily total (30 XP >= 25)"
          impact: "Users completing multiple small drills per day didn't get streak credit"
          status: "✅ FIXED"

        - name: "UI/Database Desync"
          description: "Dashboard showed stale streak (7) after auto-break set it to 0"
          impact: "Users had to navigate away and back to see updated streak"
          status: "✅ FIXED"

      solutions_implemented:
        - name: "Daily XP Accumulation"
          file: "src/lib/gamification/services/gamification-coordinator.ts"
          changes:
            - "Track xpGainedToday in user_stats"
            - "Track lastXPDate to detect day changes"
            - "Reset daily XP at midnight"
            - "Pass daily total (not per-drill XP) to streak update"
          logging: "Added detailed console logs for debugging"

        - name: "Auto-Break Refresh"
          file: "src/hooks/useStreakSaveDetection.ts"
          changes:
            - "Expose loadFromFirebase() from useGamification"
            - "Call loadFromFirebase() after successful auto-break"
            - "Dashboard immediately shows updated streak without navigation"

      testing_requirements:
        - "Run s6 scenario (7-day streak, 2 days ago, 200 XP)"
        - "Dashboard should show streak=0 immediately after auto-break"
        - "Complete 3 small drills (~5-10 XP each)"
        - "Daily XP should accumulate: 5 → 15 → 25"
        - "Streak should increment 0 → 1 after 25+ XP"
        - "Firebase should show updated lastActivityDate (today)"

architecture:
  core_concepts:
    daily_xp_accumulation:
      description: "XP earned throughout a day accumulates before checking streak threshold"
      threshold: 25
      reset_time: "Midnight (daily)"
      storage_fields:
        - "xp.xpGainedToday (number)"
        - "xp.lastXPDate (yyyy-mm-dd string)"
      flow: |
        8am: Drill 1 → 10 XP → todayXP = 10 (below threshold, no update)
        2pm: Drill 2 → 10 XP → todayXP = 20 (below threshold, no update)
        9pm: Drill 3 → 10 XP → todayXP = 30 (above threshold, increment streak!)

    xp_save_mechanic:
      description: "Users trade XP to save a breaking streak"
      cost_formula: "baseCost × daysSinceActivity (surge pricing)"
      base_cost: 25
      save_window: "1-3 days after last activity"
      eligibility:
        - "User has sufficient XP"
        - "Streak is broken (current=0) OR stale (beyond grace period)"
        - "Within save window (1-3 days)"
        - "Has lastActivityDate"
        - "brokenAt exists (auto-break has run)"

    auto_break_system:
      description: "Automatically breaks expired streaks"
      trigger: "Dashboard load (useStreakSaveDetection hook)"
      conditions:
        - "Streak > 0"
        - "Beyond grace period (24 hours)"
        - "Within save window (3 days)"
      actions:
        - "Call /api/gamification/streak/break endpoint"
        - "Set streak.current = 0"
        - "Set streak.brokenAt = now"
        - "Reload gamification data from Firebase"
        - "Show save modal"

key_files:
  critical_files:
    - path: "src/lib/gamification/services/gamification-coordinator.ts"
      purpose: "Coordinates XP/streak updates, implements daily XP tracking"
      key_changes:
        - "Lines 130-170: Daily XP accumulation logic for drills"
        - "Lines 240-280: Daily XP accumulation logic for reviews"
        - "Logs daily XP state for debugging"

    - path: "src/hooks/useGamification.ts"
      purpose: "Exposes gamification state to React components"
      key_changes:
        - "Line 41: Added loadFromFirebase to interface"
        - "Line 139: Exposed loadFromFirebase function"
        - "Allows hooks to reload data after DB updates"

    - path: "src/hooks/useStreakSaveDetection.ts"
      purpose: "Auto-break detection and modal trigger"
      key_changes:
        - "Line 39: Import loadFromFirebase from useGamification"
        - "Lines 167-176: Reload data after auto-break"
        - "Ensures UI shows updated streak immediately"

    - path: "src/app/api/gamification/streak/break/route.ts"
      purpose: "API endpoint to break expired streaks"
      transaction_logic: "Lines 111-155"
      version_conflict_detection: true

    - path: "src/app/api/gamification/streak/save/route.ts"
      purpose: "API endpoint to save streak with XP"
      cost_calculation: "Lines 224, 386"
      eligibility_validation: "Lines 108-176"
      transaction_logic: "Lines 178-347"

    - path: "src/components/gamification/StreakSaveModal.tsx"
      purpose: "Modal UI for streak save"
      zustand_updates: "Lines 120-135"
      error_handling: "Lines 60-95"

    - path: "src/app/dashboard/page.tsx"
      purpose: "Dashboard displays streak"
      display_logic: "Line 81"
      note: "Uses currentStreak (not validated effectiveStreak)"

    - path: "src/config/gamification/streak.json"
      purpose: "Runtime configuration"
      key_settings:
        minXPForStreak: 25
        gracePeriodHours: 24
        streakSave:
          enabled: true
          baseCost: 25
          maxSaveWindow: 3
          surgePricing: true

  testing_files:
    - path: "scripts/streak-time-travel.js"
      purpose: "Testing utility to manipulate streak data safely"
      alias: "streak"
      location: "/home/beano/DevProjects/next_js/moshimoshi/scripts/streak-time-travel.js"
      scenarios:
        s6: "7-day streak, 2 days ago, 200 XP (common test)"
        s1: "Fresh start (0 streak)"
        s2: "Active today"
        s3: "Yesterday (within grace)"
        s4: "2 days ago (broken)"
        s5: "4 days ago (beyond save window)"
        s7: "Active with high XP"
      commands:
        show_status: "Option 1"
        create_snapshot: "Option 2"
        restore_snapshot: "Option 3"
        scenarios: "Options 6-12"

critical_bugs_fixed:
  bug_1:
    name: "UI Shows 0, Firebase Shows 7"
    root_cause: "Client validation showing 0 before auto-break updated DB"
    file: "src/app/dashboard/page.tsx"
    line: 81
    fix: "Use currentStreak (actual DB value) instead of streakValidation.effectiveStreak"
    status: "✅ FIXED"

  bug_2:
    name: "Cost Calculation Wrong"
    root_cause: "Using daysSinceBreak (0) instead of daysSinceActivity"
    file: "src/app/api/gamification/streak/save/route.ts"
    lines: [224, 386]
    fix: "Calculate daysSinceActivity from lastActivityDate"
    status: "✅ FIXED"

  bug_3:
    name: "Same-Day Save Blocked"
    root_cause: "Old validation rejected saves on same day as break"
    file: "src/app/api/gamification/streak/save/route.ts"
    lines: [118-120]
    fix: "Removed daysSinceBreak < 1 validation check"
    rationale: "Phase 2.5 auto-breaks immediately, so daysSinceBreak=0 is valid"
    status: "✅ FIXED"

  bug_4:
    name: "Streak Not Updating After Save"
    root_cause: "Modal only updated XP, not streak in Zustand"
    file: "src/components/gamification/StreakSaveModal.tsx"
    line: 128
    fix: "Added currentStreak and lastActivityDate to setState call"
    status: "✅ FIXED"

  bug_5:
    name: "Per-Drill XP Checking"
    root_cause: "Streak validated per-activity instead of per-day XP total"
    impact: "Multiple small drills (5+10+10=25 XP) didn't count for streak"
    files:
      - "src/lib/gamification/services/gamification-coordinator.ts (drills)"
      - "src/lib/gamification/services/gamification-coordinator.ts (reviews)"
    fix:
      - "Track xpGainedToday and lastXPDate in user_stats"
      - "Reset daily XP at midnight"
      - "Accumulate XP throughout the day"
      - "Pass daily total (not per-drill XP) to streak check"
    status: "✅ FIXED"

  bug_6:
    name: "Dashboard Doesn't Refresh After Auto-Break"
    root_cause: "Auto-break updated Firebase, but Zustand kept cached value"
    impact: "Streak showed 7 after auto-break, required navigation to see 0"
    files:
      - "src/hooks/useGamification.ts"
      - "src/hooks/useStreakSaveDetection.ts"
    fix:
      - "Exposed loadFromFirebase() from useGamification hook"
      - "Call loadFromFirebase() after successful auto-break"
      - "Dashboard immediately shows updated streak"
    status: "✅ FIXED"

data_model:
  firestore_collections:
    user_stats:
      document_id: "userId"
      fields:
        xp:
          total: "number (accumulated XP)"
          level: "number (floor(total/1000))"
          xpGainedToday: "number (resets at midnight) - ADDED IN PHASE 2.5"
          lastXPDate: "string (yyyy-mm-dd) - ADDED IN PHASE 2.5"
        streak:
          current: "number (days)"
          best: "number (all-time record)"
          brokenAt: "string (ISO datetime when broken) - ADDED IN PHASE 2.5"
          version: "number (conflict detection)"
          updatedAt: "string (ISO datetime)"
        dates:
          lastActivityDate: "string (yyyy-mm-dd)"
          isActiveToday: "boolean"

    streak_save_logs:
      document_id: "auto-generated"
      fields:
        userId: "string"
        streakSaved: "number (streak value restored)"
        xpDeducted: "number (XP cost paid)"
        xpBefore: "number"
        xpAfter: "number"
        daysSinceActivity: "number (for cost calculation)"
        daysSinceBreak: "number"
        brokenAt: "string"
        lastActivityDate: "string"
        restoredTo: "string (extended to yesterday)"
        costBreakdown:
          baseCost: 25
          surgePricing: true
          daysSince: "number (multiplier)"
          totalCost: "number"
        timestamp: "Firestore Timestamp"
        createdAt: "string (ISO)"

