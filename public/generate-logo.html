<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Generate Moshimoshi Logo</title>
    <style>
        @font-face {
            font-family: 'Noto Sans JP';
            src: url('/fonts/Cookie,Noto_Sans_JP/Noto_Sans_JP/NotoSansJP-VariableFont_wght.ttf') format('truetype-variations');
            font-weight: 100 900;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background: #f0f0f0;
        }

        #canvas {
            border: 1px solid #ccc;
            display: block;
            margin: 20px 0;
            background: white;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>
    <h1>Moshimoshi Logo Generator</h1>
    <p>Click "Generate Logo" to create the logo, then "Download PNG" to save it.</p>

    <canvas id="canvas" width="512" height="512"></canvas>

    <button onclick="generateLogo()">Generate Logo</button>
    <button onclick="downloadPNG()">Download PNG</button>

    <script>
        function generateLogo() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            // Clear canvas
            ctx.clearRect(0, 0, 512, 512);

            // Draw rounded rectangle background
            const radius = 76.8;
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(512 - radius, 0);
            ctx.quadraticCurveTo(512, 0, 512, radius);
            ctx.lineTo(512, 512 - radius);
            ctx.quadraticCurveTo(512, 512, 512 - radius, 512);
            ctx.lineTo(radius, 512);
            ctx.quadraticCurveTo(0, 512, 0, 512 - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();

            // Draw the も character
            ctx.fillStyle = 'white';
            ctx.font = 'bold 205px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('も', 256, 256);
        }

        function downloadPNG() {
            const canvas = document.getElementById('canvas');
            const link = document.createElement('a');
            link.download = 'logo-mo-generated.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // Generate logo on load
        window.onload = function() {
            // Wait a bit for font to load
            setTimeout(generateLogo, 500);
        };
    </script>
</body>
</html>
